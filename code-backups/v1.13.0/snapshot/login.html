<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - PaySick</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #FF4757 0%, #E01E37 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 440px;
            padding: 48px;
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            text-align: center;
            margin-bottom: 32px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .logo-svg {
            width: 64px;
            height: 64px;
        }

        .logo-text {
            font-size: 32px;
            font-weight: 400;
            color: #1A1A1A;
            letter-spacing: -0.5px;
        }

        .logo-text span {
            font-weight: 300;
            color: #4A4A4A;
        }

        .logo p {
            color: #8A8A8A;
            font-size: 14px;
            margin-top: -8px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            color: #1A1A1A;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        input, select {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #E5E5E5;
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #FF4757;
            box-shadow: 0 0 0 4px rgba(255, 71, 87, 0.1);
        }

        .btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #FF4757 0%, #E01E37 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            margin-top: 8px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 71, 87, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 24px;
            cursor: pointer;
        }

        .remember-me input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #FF4757;
            cursor: pointer;
        }

        .remember-me label {
            font-size: 14px;
            font-weight: 400;
            color: #4A4A4A;
            margin-bottom: 0;
            cursor: pointer;
        }

        .back-home {
            text-align: center;
            margin-top: 24px;
        }

        .back-home a {
            color: #FF4757;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: opacity 0.3s ease;
        }

        .back-home a:hover {
            opacity: 0.8;
        }

        .register-cta {
            text-align: center;
            margin-top: 16px;
            font-size: 14px;
            color: #8A8A8A;
        }

        .register-cta a {
            color: #FF4757;
            text-decoration: none;
            font-weight: 600;
            transition: opacity 0.3s ease;
        }

        .register-cta a:hover {
            opacity: 0.8;
        }

        .error-message {
            background: #FFE5E8;
            color: #E01E37;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 16px;
            display: none;
            animation: none;
        }

        .error-message.show {
            display: block;
        }

        .error-message.shake {
            animation: shake 0.45s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%       { transform: translateX(-8px); }
            40%       { transform: translateX(8px); }
            60%       { transform: translateX(-5px); }
            80%       { transform: translateX(5px); }
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 44px;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
            color: #8A8A8A;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s ease;
            width: auto;
            margin-top: 0;
        }

        .toggle-password:hover {
            color: #FF4757;
            transform: translateY(-50%);
            box-shadow: none;
        }

        @media (max-width: 768px) {
            body {
                padding: 16px;
                align-items: flex-start;
                padding-top: 32px;
            }

            .login-container {
                padding: 32px 24px;
                border-radius: 12px;
            }

            .logo-svg {
                width: 52px;
                height: 52px;
            }

            .logo-text {
                font-size: 26px;
            }

            input {
                padding: 13px 14px;
                font-size: 16px; /* prevent iOS zoom on focus */
            }

            .btn {
                padding: 15px;
                font-size: 16px;
            }

            .form-group {
                margin-bottom: 18px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 12px;
                padding-top: 24px;
            }

            .login-container {
                padding: 28px 18px;
            }

            .logo {
                margin-bottom: 24px;
                gap: 12px;
            }

            .logo-svg {
                width: 44px;
                height: 44px;
            }

            .logo-text {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <svg class="logo-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <radialGradient id="loginCrossGradient" cx="40%" cy="40%">
                        <stop offset="0%" style="stop-color:#FF4757;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#E01E37;stop-opacity:1" />
                    </radialGradient>
                    <radialGradient id="loginBgCircle" cx="50%" cy="50%">
                        <stop offset="0%" style="stop-color:#FF4757;stop-opacity:0.12" />
                        <stop offset="100%" style="stop-color:#FF4757;stop-opacity:0.04" />
                    </radialGradient>
                </defs>
                <circle cx="50" cy="50" r="40" fill="url(#loginBgCircle)"/>
                <rect x="44" y="20" width="12" height="60" rx="6" fill="url(#loginCrossGradient)"/>
                <rect x="20" y="44" width="60" height="12" rx="6" fill="url(#loginCrossGradient)"/>
                <circle cx="50" cy="50" r="8" fill="#ffffff"/>
                <circle cx="50" cy="50" r="6" fill="#E01E37"/>
            </svg>
            <div class="logo-text">Pay<span>Sick</span></div>
            <p>Healthcare payments made simple</p>
        </div>

        <div class="error-message" id="errorMessage"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="you@example.com" autocomplete="username" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-wrapper">
                    <input type="password" id="password" autocomplete="current-password" placeholder="Enter your password" required>
                    <button type="button" class="toggle-password" id="togglePassword" aria-label="Show password">
                        <svg id="eyeIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="remember-me">
                <input type="checkbox" id="rememberMe">
                <label for="rememberMe">Remember me</label>
            </div>

            <div style="text-align:right;margin-top:-12px;margin-bottom:20px;">
                <a href="forgot-password.html" style="font-size:13px;color:#FF4757;text-decoration:none;font-weight:500;">Forgot password?</a>
            </div>

            <button type="submit" class="btn">Sign In</button>
        </form>

        <div class="register-cta">
            New to PaySick? <a href="register.html">Create an account</a>
        </div>

        <div class="back-home">
            <a href="index.html"><svg style="width:16px;height:16px;vertical-align:middle;margin-right:4px;" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke="#FF4757" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" d="M19 12H5M12 19l-7-7 7-7"/></svg>Back to Home</a>
        </div>

        <div style="text-align:center;margin-top:80px;padding-bottom:24px;">
            <a href="demo-login.html" style="font-size:11px;color:#D0D0D0;text-decoration:none;" tabindex="-1">Demo access</a>
        </div>
    </div>

    <script>
        // ── Password visibility toggle ──────────────────────────────────────
        document.getElementById('togglePassword').addEventListener('click', function () {
            const input = document.getElementById('password');
            const icon = document.getElementById('eyeIcon');
            const isHidden = input.type === 'password';
            input.type = isHidden ? 'text' : 'password';
            this.setAttribute('aria-label', isHidden ? 'Hide password' : 'Show password');
            icon.innerHTML = isHidden
                ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>' +
                  '<path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>' +
                  '<line x1="1" y1="1" x2="23" y2="23"/>'
                : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
        });

        // ── Error display ───────────────────────────────────────────────────
        const errorEl = document.getElementById('errorMessage');
        let errorTimer;

        function showError(msg, durationMs) {
            clearTimeout(errorTimer);
            errorEl.textContent = msg;
            // Reset animation so shake fires every call
            errorEl.classList.remove('show', 'shake');
            void errorEl.offsetWidth; // force reflow
            errorEl.classList.add('show', 'shake');
            if (durationMs) {
                errorTimer = setTimeout(() => {
                    errorEl.classList.remove('show', 'shake');
                }, durationMs);
            }
        }

        // ── Error message formatter (matches tests/unit/login-flow.test.js) ─
        function formatLoginError(data, status) {
            if (!data) return 'Login failed. Please try again.';

            if (status === 403) {
                switch (data.code) {
                    case 'EMAIL_UNVERIFIED':  return null; // caller redirects
                    case 'PASSWORD_REQUIRED': return null; // caller redirects
                    case 'ACCOUNT_LOCKED': {
                        if (data.lockedUntil) {
                            const minsLeft = Math.ceil((new Date(data.lockedUntil) - Date.now()) / 60000);
                            return minsLeft > 0
                                ? `Account locked. Try again in ${minsLeft} minute${minsLeft !== 1 ? 's' : ''}.`
                                : 'Account locked. Please try again shortly.';
                        }
                        return 'Account temporarily locked. Please try again later.';
                    }
                    case 'ACCOUNT_SUSPENDED': return 'Account suspended. Please contact support.';
                    case 'ACCOUNT_CLOSED':    return 'Account closed. Please contact support.';
                }
            }

            if (status === 401) {
                const base = data.error || 'Invalid email or password.';
                if (typeof data.attemptsRemaining === 'number' && data.attemptsRemaining > 0) {
                    return `${base} ${data.attemptsRemaining} attempt${data.attemptsRemaining !== 1 ? 's' : ''} remaining before lockout.`;
                }
                if (typeof data.attemptsRemaining === 'number' && data.attemptsRemaining === 0) {
                    return `${base} Your account has been locked.`;
                }
                return base;
            }

            if (status === 429) return data.error || 'Too many attempts. Please wait before trying again.';
            return data.error || data.message || 'Login failed. Please try again.';
        }

        // ── Role → redirect URL ─────────────────────────────────────────────
        function redirectByRole(role) {
            switch (role) {
                case 'admin':    window.location.href = 'admin-dashboard.html'; break;
                case 'provider': window.location.href = 'provider-dashboard.html'; break;
                case 'lender':   window.location.href = 'lender-dashboard.html'; break;
                default: {
                    const onboardingComplete = localStorage.getItem('paysick_onboarding_complete');
                    window.location.href = onboardingComplete === 'true' ? 'dashboard.html' : 'onboarding.html';
                }
            }
        }

        // ── Guard: manual login wins over in-flight auto-login ─────────────
        let manualLoginCompleted = false;

        // ── Auto-login via stored refresh token (Remember Me) ───────────────
        (async function attemptAutoLogin() {
            try {
                const saved = localStorage.getItem('paysick_remember');
                if (!saved) return;

                const { refreshToken, email, role } = JSON.parse(saved);
                if (!refreshToken) {
                    localStorage.removeItem('paysick_remember');
                    return;
                }

                // Prepopulate email while we try auto-login
                if (email) document.getElementById('email').value = email;
                document.getElementById('rememberMe').checked = true;

                const response = await fetch('/api/users/refresh-token', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ refreshToken })
                });

                if (!response.ok) {
                    localStorage.removeItem('paysick_remember');
                    return;
                }

                if (manualLoginCompleted) return;

                const tokens = await response.json();
                localStorage.setItem('paysick_auth_token', tokens.accessToken);

                const profileRes = await fetch('/api/users/profile', {
                    headers: { 'Authorization': 'Bearer ' + tokens.accessToken }
                });

                if (manualLoginCompleted) return;

                if (profileRes.ok) {
                    const profileData = await profileRes.json();
                    const user = profileData.user || profileData;
                    localStorage.setItem('paysick_user', JSON.stringify({
                        ...user,
                        role: user.role || role,
                        name: user.full_name
                    }));
                    redirectByRole(user.role || role);
                } else {
                    localStorage.removeItem('paysick_remember');
                }
            } catch {
                localStorage.removeItem('paysick_remember');
            }
        })();

        // ── Manual login form ───────────────────────────────────────────────
        document.getElementById('loginForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const rememberMe = document.getElementById('rememberMe').checked;
            const submitBtn = this.querySelector('button[type="submit"]');

            if (!email || !password) {
                showError('Please enter your email and password.', 3500);
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Signing in...';

            try {
                const response = await fetch('/api/users/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password, rememberMe })
                });

                let data;
                try {
                    data = await response.json();
                } catch {
                    showError(`Server error (${response.status}). Please try again shortly.`, 5000);
                    return;
                }

                if (response.ok && data.accessToken) {
                    manualLoginCompleted = true;

                    if (rememberMe && data.refreshToken) {
                        localStorage.setItem('paysick_remember', JSON.stringify({
                            refreshToken: data.refreshToken,
                            email: email,
                            role: data.user.role
                        }));
                    } else {
                        localStorage.removeItem('paysick_remember');
                    }

                    localStorage.setItem('paysick_auth_token', data.accessToken);
                    localStorage.setItem('paysick_user', JSON.stringify({
                        ...data.user,
                        name: data.user.full_name
                    }));

                    redirectByRole(data.user.role);
                    return;
                }

                // Handle special redirect cases before showing generic error
                if (response.status === 403 && data.code === 'EMAIL_UNVERIFIED') {
                    showError('Please verify your email address first. Redirecting…');
                    setTimeout(() => {
                        window.location.href = `verify-email.html?email=${encodeURIComponent(data.email || email)}`;
                    }, 1800);
                    return;
                }

                if (response.status === 403 && data.code === 'PASSWORD_REQUIRED') {
                    showError('Please set a password for your account. Redirecting to reset page…');
                    setTimeout(() => {
                        window.location.href = `forgot-password.html?email=${encodeURIComponent(email)}`;
                    }, 1800);
                    return;
                }

                const msg = formatLoginError(data, response.status);
                showError(msg || data.error || 'Login failed. Please try again.', 5000);

            } catch (error) {
                showError(error.message || 'Login failed. Please try again.', 4000);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Sign In';
            }
        });
    </script>


<!-- Honeypot trap (CLAUDE.md: Bot Crawling Prevention).
     Invisible to real users, screen readers and keyboard nav. Any client that
     follows it hits GET /api/hp-check and is blocked for the session. -->
<a href="/api/hp-check" style="display:none" aria-hidden="true" tabindex="-1" rel="nofollow">Directory</a>
</body>
</html>
